server:
  port: 8087

spring:
  application:
    name: mcp-client
  main:
    web-application-type: reactive  # 使用响应式编程

# 禁用 ChatClient 的自动配置，因为项目要自定义 ChatClient 配置，具体见 McpConfig
spring.ai.chat.client.enabled: false

# LLM 配置
spring.ai.openai:
  base-url: https://open.bigmodel.cn/api/paas/v4
  api-key: ${GLM_API_KEY}
  chat:
    options:
      model: glm-4-flash
      stream-options: true

# Mcp Client 配置
# SSE 端点路径，客户端通过此路径与服务端建立 SSE 长连接
# 连接建立后，服务端可主动向客户端推送 Tools 工具
# AsyncMcpToolCallbackProvider 负责把服务端推送的远程工具，包装成本地可调用的 ToolCallback
# 客户端可以像调用本地工具一样，无缝调用远程服务端的工具。
spring.ai.mcp.client:
  sse:
    connections:
      server-light:
        url: http://localhost:8081
        sse-endpoint: /sse
      server-lock:
        url: http://localhost:8082
        sse-endpoint: /sse
  type: async
  toolcallback:
    enabled: true

logging:
  level:
    io.modelcontextprotocol.client: debug
    io.modelcontextprotocol.spec: debug


